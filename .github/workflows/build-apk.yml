name: Build Android APK
on:
  push:
    branches: [main, 'icalc-s26']
    paths-ignore:
      - '**/*.md'
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk iCalcS26-v1.0.0-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iCalcS26-APK
          path: iCalcS26-v1.0.0-debug.apk
          retention-days: 30
