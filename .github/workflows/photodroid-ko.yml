name: PhotoDroid Korean APK

on:
  push:
    branches: [photodroid-ko]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photodroid-ko-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  tests:
    name: Validate tested editor source
    if: github.ref == 'refs/heads/photodroid-ko'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the pinned source and verified Korean font
        run: bash photodroid/scripts/prepare-source.sh
      - name: Verify the exact editor source against the 77-test passing build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source photodroid/scripts/config.sh
          python3 photodroid/scripts/reuse-verified-native.py --source-dir "$SOURCE_DIR" --check-only
      - name: Keep the source comparison and test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDroid-ko-source-validation
          path: ${{ runner.temp }}/native-reuse-info.txt
          if-no-files-found: ignore
          retention-days: 30

  apk:
    name: Repackage verified arm64 engine and sign APK
    if: github.ref == 'refs/heads/photodroid-ko'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source photodroid/scripts/config.sh
          python3 photodroid/scripts/check-release.py
      - name: Prepare the pinned source and verified Korean font
        run: bash photodroid/scripts/prepare-source.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install the pinned Android SDK for packaging
        run: bash photodroid/scripts/install-android.sh --sdk-only
      - name: Verify source and reuse the checksum-verified 16 KB native library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source photodroid/scripts/config.sh
          python3 photodroid/scripts/reuse-verified-native.py --source-dir "$SOURCE_DIR"
      - name: Package the complete corresponding source
        run: |
          source photodroid/scripts/config.sh
          python3 photodroid/scripts/package-source.py
      - name: Prepare an authenticated recipient for the existing signing key
        id: signing_import
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash photodroid/scripts/prepare-signing-import.sh
      - name: Share only this job's public recipient certificate
        if: steps.signing_import.outputs.needs_import == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDroid-signing-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signing-import/recipient-public.pem
            ${{ runner.temp }}/signing-import/recipient-info.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Sign, assemble and verify the APK
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash photodroid/scripts/sign-package.sh
      - name: Remove the temporary recipient private key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/signing-import"
      - name: Keep the verified release files
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDroid-ko-release-files
          path: |
            dist/PhotoDroid-KO-0.3.0-ko.2-arm64.apk
            dist/PhotoDroid-KO-0.3.0-ko.2-source.zip
            dist/BUILD-INFO.txt
            dist/APK-VERIFICATION.txt
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release:
    name: Publish the verified packaging update
    needs: [tests, apk]
    if: github.ref == 'refs/heads/photodroid-ko'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PhotoDroid-ko-release-files
          path: dist
      - name: Verify the checksums and create a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash photodroid/scripts/publish-release.sh
